<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f3f4;
}

header{
background:#34A853;
color:white;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:170px;
border-radius:12px;
object-fit:cover;
}

.card h2{
font-size:18px;
margin:10px 0;
}

.card a{
display:inline-block;
padding:10px 20px;
background:#34A853;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}
</style>

</head>
<body>

<header>Play Store</header>

<div class="container">

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/en/5/53/Hill_Climb_Racing.png">
<h2>Hill Climb Racing</h2>
<a href="#">Download</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/en/3/32/Subway_Surfers_app_logo.png">
<h2>Subway Surfers</h2>
<a href="#">Download</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/en/1/18/Dr._Driving.jpg">
<h2>Dr. Driving</h2>
<a href="#">Download</a>
</div>

<div class="card">
<img src="https://upload.wikimedia.org/wikipedia/en/a/a0/Free_Fire_Logo.png">
<h2>Free Fire</h2>
<a href="#">Download</a>
</div>

</div>

</body>
</html>
